<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e65f72"><title>익명의 편지함 | EveryTimeMatch</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f9f3f6;color:#29212a;font-family:system-ui,-apple-system,sans-serif}.app{max-width:480px;min-height:100vh;margin:auto;background:#fff;padding:22px 20px 65px}header{display:flex;align-items:center;justify-content:space-between}a{color:#b34d74;text-decoration:none}h1{font-size:31px;margin:35px 0 8px}h2{font-size:20px}.sub{color:#8b7a85;line-height:1.7}.hero{background:linear-gradient(135deg,#fff0f4,#f7edff);border-radius:24px;padding:25px;margin:24px 0;text-align:center}.hero .emoji{font-size:62px}.tabs{display:flex;gap:6px;margin:20px 0}.tabs button{flex:1;padding:12px 4px;border:0;border-radius:12px;background:#f6f2f4;color:#786d75;font-weight:700}.tabs button.active{background:#d95f86;color:#fff}.panel{border:1px solid #f0dfe5;border-radius:20px;padding:18px;margin:15px 0;background:#fff}.letter{white-space:pre-wrap;line-height:1.85;padding:19px;background:#fff7fa;border-radius:14px;margin:14px 0}.btn{border:0;border-radius:13px;padding:13px 16px;background:#d95f86;color:#fff;font-weight:700;cursor:pointer}.btn.alt{background:#f8edf2;color:#a34466}.btn:disabled{opacity:.45;cursor:default}.btn.full{width:100%;margin-top:12px}textarea{width:100%;min-height:130px;padding:14px;border-radius:13px;border:1px solid #e5ccd7;font:inherit;resize:vertical}small{color:#95848d}.hidden{display:none!important}.msg{padding:13px;border-radius:12px;background:#f8f2f5;line-height:1.5;font-size:13px;margin:14px 0}.error{color:#a62245;background:#fff0f3}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.reply{padding:14px;border-radius:13px;border:1px solid #f1e2e9;margin-top:12px;white-space:pre-wrap;line-height:1.7}</style></head><body><main class="app"><header><b>EveryTimeMatch 💌</b><a href="/">서비스로 돌아가기</a></header><h1>익명의 편지함</h1><p class="sub">프로필보다 먼저, 마음이 도착합니다.<br>시험이 끝난 지금 누군가의 이야기를 읽어보세요.</p><div class="hero"><div class="emoji">💌</div><b>AFTER EXAM</b><p class="sub">편지를 읽고 답장하면 새로운 인연이 시작될지도 몰라요.</p></div><div id="notice" class="msg">로그인 상태를 확인하는 중이에요.</div><div id="content" class="hidden"><div class="tabs"><button data-tab="write" class="active">편지 쓰기</button><button data-tab="browse">편지 읽기</button><button data-tab="inbox">받은 답장</button></div><section id="write"><h2>익명 편지 작성</h2><p class="sub">한 사람당 편지 한 통을 보낼 수 있어요. 개인 연락처는 적지 말아 주세요.</p><textarea id="body" maxlength="200" placeholder="시험 끝나면 같이 하고 싶은 일이나 요즘 관심 있는 이야기를 남겨보세요."></textarea><div class="row"><small id="count">0 / 200자 · 최소 30자</small><small>익명으로 공개</small></div><button class="btn full" id="submit">편지 보내기</button></section><section id="browse" class="hidden"><h2>누군가의 편지</h2><div id="letters"></div><button class="btn alt full" id="reload">새로고침</button></section><section id="inbox" class="hidden"><h2>내 편지에 도착한 답장</h2><div id="replies"></div><button class="btn alt full" id="refreshReplies">답장 새로고침</button></section></div><p class="sub" style="font-size:12px;margin-top:30px">신고·차단 기능이 준비되기 전에는 실제 공개 이벤트로 운영하지 마세요.</p></main><script>
const db=window.supabase.createClient('https://mrbuxqaeqvuevplpssgi.supabase.co','sb_publishable_x8mtMxk3tQnIB4oI5gOc1A_aH2pL0OE');const $=id=>document.getElementById(id);let busy=false;
function msg(t,err=false){$('notice').textContent=t;$('notice').className='msg'+(err?' error':'')}
function el(tag,txt,cls){let n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;return n}
async function rpc(name,args){let {data,error}=await db.rpc(name,args);if(error)throw error;return data}
function tab(t){for(const x of ['write','browse','inbox'])$(x).classList.toggle('hidden',x!==t);document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));if(t==='browse')browse();if(t==='inbox')inbox()}
async function browse(){const box=$('letters');box.replaceChildren(el('p','편지를 불러오는 중...','sub'));try{const list=await rpc('event_browse_letters');box.replaceChildren();if(!list.length){box.append(el('p','아직 읽을 수 있는 편지가 없어요.','sub'));return}for(const item of list){const card=el('article',undefined,'panel');card.append(el('small','FROM. 익명의 학생'),el('div',item.letter_body,'letter'));const area=el('div');const input=el('textarea');input.maxLength=200;input.placeholder='상대방에게 보낼 답장을 적어 주세요';input.classList.add('hidden');const btn=el('button','답장하기','btn');btn.onclick=async()=>{if(input.classList.contains('hidden')){input.classList.remove('hidden');btn.textContent='답장 전송';return}if(!input.value.trim())return alert('답장을 작성해 주세요');if(busy)return;busy=true;btn.disabled=true;try{await rpc('event_reply_letter',{p_letter:item.letter_id,p_body:input.value.trim()});msg('답장을 보냈어요!');await browse()}catch(e){msg(e.message,true)}finally{busy=false;btn.disabled=false}};area.append(input,btn);card.append(area);box.append(card)}}catch(e){box.replaceChildren(el('p','편지를 불러오지 못했어요: '+e.message,'msg error'))}}
async function inbox(){const box=$('replies');box.replaceChildren(el('p','답장을 불러오는 중...','sub'));try{const list=await rpc('event_my_replies');box.replaceChildren();if(!list.length){box.append(el('p','아직 받은 답장이 없어요.','sub'));return}for(const item of list){const card=el('article',undefined,'panel');card.append(el('small','익명의 답장'),el('div',item.reply_body,'reply'));const btn=el('button',item.accepted?'연결 완료':'인연 이어가기','btn full');btn.disabled=item.accepted;btn.onclick=async()=>{if(!confirm('이 답장을 보낸 사람과 매칭할까요?'))return;btn.disabled=true;try{await rpc('event_accept_reply',{p_reply:item.reply_id});msg('매칭됐어요! 기존 매칭 목록에서 확인해 주세요.');await inbox()}catch(e){msg(e.message,true);btn.disabled=false}};card.append(btn);box.append(card)}}catch(e){box.replaceChildren(el('p','답장을 불러오지 못했어요: '+e.message,'msg error'))}}
$('body').addEventListener('input',()=>{$('count').textContent=$('body').value.trim().length+' / 200자 · 최소 30자'});$('submit').onclick=async()=>{const v=$('body').value.trim();if(v.length<30||v.length>200)return msg('편지는 30~200자로 작성해 주세요.',true);if(!confirm('편지는 한 번만 보낼 수 있어요. 작성할까요?'))return;$('submit').disabled=true;try{await rpc('event_write_letter',{p_body:v});msg('편지가 등록됐어요! 받은 답장은 편지함에서 확인할 수 있어요.');$('body').disabled=true}catch(e){msg(e.message,true);$('submit').disabled=false}};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));$('reload').onclick=browse;$('refreshReplies').onclick=inbox;
(async()=>{try{const {data:{user},error}=await db.auth.getUser();if(error||!user){msg('기존 EveryTimeMatch에 로그인한 후 다시 열어 주세요.');return}const {data:profile,error:pe}=await db.from('profiles').select('user_id').eq('user_id',user.id).maybeSingle();if(pe||!profile){msg('먼저 기존 서비스에서 프로필을 완성해 주세요.');return}$('content').classList.remove('hidden');msg('로그인 확인 완료 · 익명 편지 이벤트 테스트 화면')}catch(e){msg(e.message,true)}})();
</script></body></html>
