name: Anonymous letters checks
on:
  pull_request:
  push:
    branches:
      - feature/after-exam-letters
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JS syntax and event safety invariants
        run: node --test tests/letters.test.mjs
